[tool:pytest]
# Pytest configuration for KDP Strategist

# Test discovery
testpaths = 
    tests/unit
    tests/integration
    tests/e2e
    tests/performance
    tests/validation
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 6.0

# Add options
addopts = 
    --strict-markers
    --strict-config
    --tb=short
    --durations=10
    --color=yes
    --disable-warnings
    --verbose
    --showlocals
    --collect-only-on-failure

# Markers for test categorization
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    performance: Performance tests
    validation: Data validation tests
    slow: Slow running tests
    api: API endpoint tests
    database: Database related tests
    cache: Cache related tests
    mock: Tests using mock data
    real_api: Tests requiring real API access
    stress: Stress tests
    regression: Regression tests

# Test timeout (in seconds)
timeout = 300

# Asyncio configuration
asyncio_mode = auto

# Coverage configuration
[coverage:run]
source = src
omit = 
    */tests/*
    */venv/*
    */env/*
    */__pycache__/*
    */migrations/*
    */conftest.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

show_missing = True
precision = 2

[coverage:html]
directory = htmlcov